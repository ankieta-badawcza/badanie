<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badanie naukowe</title>
</head>
<body>
    <p>Trwa losowanie warunku badania...</p>

    <script>
        const links = [
            "https://forms.gle/aCeP6tFNxG5yfCGW9",
            "https://forms.gle/pZBnvH11R7Wdvm4S9",
            "https://forms.gle/VhXZ7W1zToKL2dwz6",
            "https://forms.gle/hdhYuh7WXELmuPmi8"
        ];

        const storageKey = "badanie_wylosowany_warunek_v1";
        let index;

        try {
            const saved = localStorage.getItem(storageKey);

            if (saved !== null &&
                Number.isInteger(Number(saved)) &&
                Number(saved) >= 0 &&
                Number(saved) < links.length) {
                index = Number(saved);
            }
        } catch (e) {}

        if (index === undefined) {
            index = Math.floor(Math.random() * links.length);

            try {
                localStorage.setItem(storageKey, String(index));
            } catch (e) {}
        }

        window.location.replace(links[index]);
    </script>
</body>
</html>
